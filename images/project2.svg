<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="300" height="175">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" rx="12" fill="#0f172a"/>
  <!-- Top Bar -->
  <rect width="600" height="40" rx="12" fill="#1e293b"/>
  <rect y="25" width="600" height="15" fill="#1e293b"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#0f172a"/>
  <text x="120" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">https://travelblog.ge</text>

  <!-- Travel Hero Section with Mountains -->
  <rect x="30" y="60" width="540" height="150" rx="8" fill="url(#p2Grad)"/>
  <!-- Sun -->
  <circle cx="480" cy="110" r="28" fill="#fef08a"/>
  <!-- Mountain peaks -->
  <polygon points="80,210 180,100 280,210" fill="#065f46" opacity="0.8"/>
  <polygon points="150,132 180,100 210,132" fill="#ffffff" opacity="0.9"/>
  <polygon points="220,210 330,80 440,210" fill="#047857"/>
  <polygon points="300,118 330,80 360,118" fill="#ffffff"/>
  
  <text x="50" y="100" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Georgia Travel &amp; Adventure</text>
  <text x="50" y="125" fill="#d1fae5" font-family="sans-serif" font-size="14">ტურისტული გზამკვლევი და ბლოგ-პოსტები</text>

  <!-- Blog articles preview -->
  <rect x="30" y="230" width="255" height="90" rx="8" fill="#1e293b"/>
  <rect x="45" y="245" width="120" height="12" rx="4" fill="#38bdf8"/>
  <rect x="45" y="265" width="200" height="8" rx="3" fill="#64748b"/>
  <rect x="45" y="280" width="160" height="8" rx="3" fill="#64748b"/>

  <rect x="315" y="230" width="255" height="90" rx="8" fill="#1e293b"/>
  <rect x="330" y="245" width="120" height="12" rx="4" fill="#a855f7"/>
  <rect x="330" y="265" width="200" height="8" rx="3" fill="#64748b"/>
  <rect x="330" y="280" width="160" height="8" rx="3" fill="#64748b"/>
</svg>
