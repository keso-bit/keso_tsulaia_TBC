<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="300" height="175">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" rx="12" fill="#18181b"/>
  <!-- Top Bar -->
  <rect width="600" height="40" rx="12" fill="#27272a"/>
  <rect y="25" width="600" height="15" fill="#27272a"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#18181b"/>
  <text x="120" y="24" fill="#a1a1aa" font-family="sans-serif" font-size="12">https://taskflow.app</text>

  <!-- Dashboard Top -->
  <rect x="30" y="60" width="540" height="60" rx="8" fill="url(#p3Grad)"/>
  <text x="50" y="97" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">TaskFlow - პროექტების მართვა</text>

  <!-- Kanban Columns -->
  <!-- Col 1: To Do -->
  <rect x="30" y="135" width="165" height="185" rx="8" fill="#27272a"/>
  <text x="45" y="158" fill="#e4e4e7" font-family="sans-serif" font-weight="bold" font-size="13">შესასრულებელი (3)</text>
  <rect x="40" y="170" width="145" height="40" rx="6" fill="#3f3f46"/>
  <rect x="50" y="185" width="90" height="8" rx="2" fill="#f43f5e"/>
  <rect x="40" y="220" width="145" height="40" rx="6" fill="#3f3f46"/>
  <rect x="50" y="235" width="110" height="8" rx="2" fill="#fbbf24"/>

  <!-- Col 2: In Progress -->
  <rect x="217" y="135" width="165" height="185" rx="8" fill="#27272a"/>
  <text x="232" y="158" fill="#e4e4e7" font-family="sans-serif" font-weight="bold" font-size="13">მიმდინარე (2)</text>
  <rect x="227" y="170" width="145" height="50" rx="6" fill="#3f3f46"/>
  <rect x="237" y="185" width="120" height="8" rx="2" fill="#38bdf8"/>
  <circle cx="350" cy="205" r="8" fill="#6366f1"/>

  <!-- Col 3: Done -->
  <rect x="405" y="135" width="165" height="185" rx="8" fill="#27272a"/>
  <text x="420" y="158" fill="#e4e4e7" font-family="sans-serif" font-weight="bold" font-size="13">დასრულებული (5)</text>
  <rect x="415" y="170" width="145" height="40" rx="6" fill="#3f3f46"/>
  <rect x="425" y="185" width="100" height="8" rx="2" fill="#22c55e"/>
  <rect x="415" y="220" width="145" height="40" rx="6" fill="#3f3f46"/>
  <rect x="425" y="235" width="90" height="8" rx="2" fill="#22c55e"/>
</svg>
