<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="300" height="175">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" rx="12" fill="#1e293b"/>
  <!-- Browser Chrome Top Bar -->
  <rect width="600" height="40" rx="12" fill="#334155"/>
  <rect y="25" width="600" height="15" fill="#334155"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#1e293b"/>
  <text x="120" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">https://mystore.example.com</text>

  <!-- Banner / Hero in page -->
  <rect x="30" y="60" width="540" height="90" rx="8" fill="url(#p1Grad)"/>
  <text x="60" y="105" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Online Store &amp; E-Commerce</text>
  <text x="60" y="130" fill="#e0e7ff" font-family="sans-serif" font-size="14">პროდუქტების კატალოგი &amp; ონლაინ შეკვეთის სისტემა</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <rect x="30" y="170" width="165" height="150" rx="8" fill="#0f172a"/>
  <rect x="45" y="185" width="135" height="70" rx="6" fill="#3b82f6" opacity="0.3"/>
  <circle cx="112" cy="220" r="22" fill="#60a5fa"/>
  <rect x="45" y="270" width="90" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="45" y="290" width="50" height="12" rx="3" fill="#10b981"/>

  <!-- Product 2 -->
  <rect x="217" y="170" width="165" height="150" rx="8" fill="#0f172a"/>
  <rect x="232" y="185" width="135" height="70" rx="6" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="299" cy="220" r="22" fill="#a78bfa"/>
  <rect x="232" y="270" width="80" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="232" y="290" width="50" height="12" rx="3" fill="#10b981"/>

  <!-- Product 3 -->
  <rect x="405" y="170" width="165" height="150" rx="8" fill="#0f172a"/>
  <rect x="420" y="185" width="135" height="70" rx="6" fill="#ec4899" opacity="0.3"/>
  <circle cx="487" cy="220" r="22" fill="#f472b6"/>
  <rect x="420" y="270" width="85" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="420" y="290" width="50" height="12" rx="3" fill="#10b981"/>
</svg>
